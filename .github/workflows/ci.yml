name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  resolve-vendor:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Exercise canonical GHI enrollment
        shell: bash
        run: |
          python -S - <<'PY'
          from pathlib import Path
          for name in ('gh_identity.py', 'gh_identity-LICENSE'):
              Path('vendor', name).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py enroll --manifest vendor.lock.json | tee vendor-enrollment.json
          python -S -m json.tool vendor-enrollment.json > /dev/null
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          from pathlib import Path
          for name in ('xprobe.py', 'xprobe_pytest.py', 'xprobe-LICENSE', 'gh_identity.py', 'gh_identity-LICENSE'):
              Path('vendor', name).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Stage canonical vendor evidence
        if: always()
        shell: bash
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --manifest vendor.lock.json --kind locked --output build/vendor-evidence-candidate
          --runtime-evidence vendor-enrollment.json
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: build/vendor-evidence-candidate
          if-no-files-found: error
          retention-days: 14

  test:
    if: needs.changes.outputs.product_changed == 'true'
    needs: [changes, resolve-vendor]
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('enrolled_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Compile artifact and CLI
        run: python -m py_compile yourself.py scripts/yourself_cli.py vendor/xprobe_pytest.py
      - name: Verify standalone runtime
        run: python -S -c "import yourself"
      - name: Runner fingerprint mutation check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/runner_fingerprint_mutations.py
      - name: Runner environment fingerprint (real runner)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          mkdir -p reports
          python yourself.py --runner-env --runner-env-json --runner-env-github-summary \
            > reports/runner-fingerprint.json
          python yourself.py --runner-env
      - name: Preserve runner fingerprint artifact
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: runner-fingerprint-ubuntu-py3.12
          path: reports/runner-fingerprint.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test with branch coverage
        env:
          YOURSELF_FAILURE_EVIDENCE: controlled-failure
        run: python -m pytest -p vendor.xprobe_pytest --xprobe-jsonl=reports/pytest-events.jsonl --xprobe-repository=myon-bioinformatics/yourself --cov=yourself --cov-branch --cov-report=term-missing --cov-fail-under=90 --junitxml=reports/junit.xml
      - name: Preserve test report (including failed tests)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-failure-${{ matrix.os }}-py${{ matrix.python }}
          path: controlled-failure/
          if-no-files-found: error
          retention-days: 14

      - name: Stage canonical vendor evidence
        if: always()
        shell: bash
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --manifest vendor.lock.json --kind locked --output build/vendor-evidence-test
          --runtime-evidence vendor-enrollment.json
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-${{ matrix.os }}-py${{ matrix.python }}
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["test-report-ubuntu-latest-py3.11/junit.xml","test-report-ubuntu-latest-py3.12/junit.xml","test-report-ubuntu-latest-py3.13/junit.xml","test-report-ubuntu-latest-py3.14/junit.xml","test-report-windows-latest-py3.12/junit.xml","test-report-macos-latest-py3.12/junit.xml"]'
      artifact-pattern: "test-report-*"
      output-artifact: "failure-identity"

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflow_changed == 'true'
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-actionlint.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
