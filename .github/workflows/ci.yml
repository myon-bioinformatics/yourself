name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update

permissions:
  contents: read

jobs:
  resolve-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 872951df1653c2d9dc10d35cd7358d979cc344fc
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check
      - name: Exercise canonical GHI enrollment
        shell: bash
        run: |
          python -S - <<'PY'
          from pathlib import Path
          for name in ('gh_identity.py', 'gh_identity-LICENSE'):
              Path('vendor', name).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py enroll --manifest vendor.lock.json | tee vendor-enrollment.json
          python -S -m json.tool vendor-enrollment.json > /dev/null
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          from pathlib import Path
          for name in ('xprobe.py', 'xprobe_pytest.py', 'xprobe-LICENSE', 'gh_identity.py', 'gh_identity-LICENSE'):
              Path('vendor', name).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize
          python -S .vendor-sync-tools/vendor_sync.py check
      - name: Update public vendor files for this run
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py promote --manifest vendor.lock.json | tee vendor-promotion.json
          python -S -m json.tool vendor-promotion.json > /dev/null
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: |
            vendor.lock.json
            vendor-enrollment.json
            ${{ inputs.vendor-mode != 'locked' && 'vendor-promotion.json' || '' }}
            vendor/xprobe.py
            vendor/xprobe_pytest.py
            vendor/xprobe-LICENSE
            vendor/gh_identity.py
            vendor/gh_identity-LICENSE
          if-no-files-found: error
          retention-days: 14

  test:
    needs: resolve-vendor
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 872951df1653c2d9dc10d35cd7358d979cc344fc
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('enrolled_ghi','vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Compile artifact and CLI
        run: python -m py_compile yourself.py scripts/yourself_cli.py vendor/xprobe_pytest.py
      - name: Verify standalone runtime
        run: python -S -c "import yourself"
      - name: Test with branch coverage
        env:
          YOURSELF_FAILURE_EVIDENCE: controlled-failure
        run: python -m pytest -p vendor.xprobe_pytest --xprobe-jsonl=reports/pytest-events.jsonl --xprobe-repository=myon-bioinformatics/yourself --cov=yourself --cov-branch --cov-report=term-missing --cov-fail-under=90 --junitxml=reports/junit.xml
      - name: Preserve test report (including failed tests)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-failure-${{ matrix.os }}-py${{ matrix.python }}
          path: controlled-failure/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            vendor.lock.json
            vendor-enrollment.json
            ${{ inputs.vendor-mode != 'locked' && 'vendor-promotion.json' || '' }}
            vendor/xprobe.py
            vendor/xprobe_pytest.py
            vendor/xprobe-LICENSE
            vendor/gh_identity.py
            vendor/gh_identity-LICENSE
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: test
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["test-report-ubuntu-latest-py3.10/junit.xml","test-report-ubuntu-latest-py3.11/junit.xml","test-report-ubuntu-latest-py3.12/junit.xml","test-report-ubuntu-latest-py3.13/junit.xml","test-report-ubuntu-latest-py3.14/junit.xml","test-report-windows-latest-py3.12/junit.xml","test-report-macos-latest-py3.12/junit.xml"]'
      artifact-pattern: "test-report-*"
      output-artifact: "failure-identity"
